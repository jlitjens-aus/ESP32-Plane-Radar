; ESP32-S3-WROOM-1 (N16R8: 16MB Flash / 8MB Octal PSRAM) + ST7789 SPI LCD (240×240)

[env:supermini]
; Keeps the pinned PlatformIO Expressif32 engine version
platform = espressif32@6.5.0

; Target board definition for ESP32-S3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Retain custom partition scheme and post-build scripts from original ESP32-Plane-Radar repo
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Embed VLW font file required for radar text rendering
board_build.embed_files = data/ui_font.vlw

; --- Memory & Flash settings for N16R8 ---
; Quad SPI Flash (QIO) + Octal PSRAM (OPI) memory mode
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; Compiler build flags
build_flags =
  -std=gnu++17
  ; Enable Native USB CDC for serial logging on S3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Tell ESP-IDF/Arduino that PSRAM hardware is present
  -DBOARD_HAS_PSRAM
  ; Disable extra WiFiManager debug logs
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2
